apiVersion: apps/v1
kind: Deployment
metadata:
  name: execucao-service
  namespace: oficina-execucao-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: execucao-service
  template:
    metadata:
      labels:
        app: execucao-service
    spec:
      containers:
        - name: execucao-service
          image: oficina-execucao-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: execucao-service-config
            - secretRef:
                name: execucao-service-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: execucao-service
  namespace: oficina-execucao-service
spec:
  type: NodePort
  selector:
    app: execucao-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30083
