# Exemplo de formato do Secret — NUNCA commitar valores reais.
#
# kubectl create secret generic execucao-service-secret -n oficina-execucao-service \
#   --from-literal=Jwt__Secret='...' \
#   --from-literal=Messaging__SnsTopicArn='arn:aws:sns:us-east-1:...:oficina-wagyu-saga-events' \
#   --from-literal=Messaging__SqsQueueUrl='https://sqs.us-east-1.amazonaws.com/.../oficina-wagyu-execucao-queue'
#
apiVersion: v1
kind: Secret
metadata:
  name: execucao-service-secret
  namespace: oficina-execucao-service
type: Opaque
stringData:
  Jwt__Secret: "COLE_AQUI_O_MESMO_SEGREDO_USADO_PELO_OS_SERVICE"
  Messaging__SnsTopicArn: "arn:aws:sns:us-east-1:<account-id>:oficina-wagyu-saga-events"
  Messaging__SqsQueueUrl: "https://sqs.us-east-1.amazonaws.com/<account-id>/oficina-wagyu-execucao-queue"
